# Status bar background and foreground
set-option -g status-style bg=#f4ecd4,fg=#657b83

# Window styles
set-window-option -g window-status-style bg=default
# set-window-option -g window-status-current-style bg=default,fg=#859900  # green
set-window-option -g window-status-current-style bg=default,fg=#cb4b16

# Mode and message styling
set -g mode-style "fg=#f4ecd4,bg=#657b83"
set -g message-style "fg=#f4ecd4,bg=#657b83"
set -g message-command-style "fg=#f4ecd4,bg=#657b83"

# Pane borders
set -g pane-border-style "fg=#93a1a1"          # base1
set -g pane-active-border-style "fg=#268bd2"   # blue

# Status bar layout
set -g status "on"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

# Powerline-style segments
set -g status-left "#[fg=#f4ecd4,bg=#268bd2,bold] #S #[fg=#268bd2,bg=#f4ecd4,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#f4ecd4,bg=#f4ecd4,nobold,nounderscore,noitalics]#[fg=#719cd6,bg=#f4ecd4] #{prefix_highlight} #[fg=#859900,bg=#f4ecd4,nobold,nounderscore,noitalics]#[fg=#ffffff,bg=#859900] %Y-%m-%d #[fg=#f4ecd4,bg=#859900,nobold,nounderscore,noitalics]#[fg=#b58900,bg=#f4ecd4]#[fg=#ffffff,bg=#b58900] %I:%M %p #[fg=#f4ecd4,bg=#b58900,nobold,nounderscore,noitalics]#[fg=#719cd6,bg=#f4ecd4,nobold,nounderscore,noitalics]#[fg=#ffffff,bg=#719cd6,bold] #h "

# Window status formatting
setw -g window-status-activity-style "underscore,fg=#657b83,bg=#f4ecd4"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#000000,bg=#f4ecd4"

setw -g window-status-format "#[fg=#f4ecd4,bg=#f4ecd4,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#f4ecd4,bg=#f4ecd4,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#f4ecd4,bg=#cb4b16,nobold,nounderscore,noitalics]#[fg=#f4ecd4,bg=#cb4b16,bold] #I  #W #F #[fg=#cb4b16,bg=#f4ecd4,nobold,nounderscore,noitalics]"
