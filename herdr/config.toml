onboarding = false

[theme]
auto_switch = true
light_name = "solarized-light"
dark_name = "catppuccin"

[ui]
agent_panel_sort = "spaces"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
prompt_new_tab_name = false

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[ui.sidebar.agents]
row_gap = 0

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "$feature"], ["$task"], ["$branch", "agent", "$account"]]

# Direct (prefix-less) chords use alt: ctrl+hjkl is consumed by tmux's
# vim-navigator bindings and never reaches herdr.
[keys]
focus_agent = "alt+1..9"
next_agent = "alt+j"
previous_agent = "alt+k"
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_right = ["prefix+l", "alt+l"]
close_pane = ["prefix+x", "alt+x"]
open_notification_target = "alt+o"
zoom = "alt+f"
new_tab = "alt+t"
switch_tab = ["prefix+1..9", "cmd+1..9"]

split_vertical = "prefix+backslash"
split_horizontal = "prefix+minus"
last_pane = "prefix+a"

new_workspace = "alt+n"
new_worktree = "alt+shift+g"
switch_workspace = "prefix+shift+1..9"
next_workspace = "prefix+shift+l"
previous_workspace = "prefix+shift+h"
open_worktree = "prefix+g"

[[keys.command]]
key = "alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

# herdr runs [[keys.command]] entries without an interactive shell, so a zsh
# alias or function is not visible here. Commands are resolved from PATH, so
# these name scripts that `install` symlinks into ~/.local/bin.
# herdr-claude-tab opens a new tab and runs claude-account in it; there is no
# type = "tab", so it is a detached shell command that drives the socket API.
[[keys.command]]
key = "alt+c"
type = "shell"
command = "herdr-claude-tab"

# Explicit account regardless of cwd; both route through claude-account.
[[keys.command]]
key = "alt+w"
type = "pane"
command = "claude-work"

[[keys.command]]
key = "alt+shift+p"
type = "pane"
command = "claude-personal"

# Current folder in nvim; the temporary pane follows the focused pane's cwd.
[[keys.command]]
key = "alt+e"
type = "pane"
command = "nvim ."

[[keys.command]]
key = "alt+a"
type = "popup"
command = "herdr-agent-switch"
width = "80%"
height = "60%"

[session]
resume_agents_on_restore = true

[advanced]
scrollback_limit_bytes = 25000000
